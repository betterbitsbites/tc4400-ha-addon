name: Technicolor TC4400 Modem Scraper
version: "1.8.0"
slug: technicolor_modem_scrape
description: Publishes TC4400 cable modem signal levels, SNR and errors to MQTT (auto-discovered by Home Assistant). Scraper by Philipp Reichmuth (phrxmd).
url: https://github.com/coaxx77/tc4400-ha-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
services:
  - mqtt:want
options:
  modem_url: "http://192.168.100.1"
  modem_username: admin
  modem_password: "bEn2o#US9s"
  scan_interval: 300
  mqtt_topic_prefix: homeassistant/sensor
  mqtt_uid_prefix: cablemodem
  verbose: false
  history_length: 30
  power_switch: ""
  power_sensor: ""
  restart_off_seconds: 15
  dashboard_title: Cable modem
  dashboard_url: cable-modem
  dashboard_cards: auto
  dashboard_hours: 48
  latency_enabled: true
  latency_targets:
    - 1.1.1.1
  latency_interval: 1
  latency_window: 10
  latency_threshold: 30
  latency_method: auto
  latency_tcp_port: 443
schema:
  modem_url: url
  modem_username: str
  modem_password: password
  scan_interval: int(30,86400)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  mqtt_uid_prefix: str
  verbose: bool
  history_length: int(0,120)
  power_switch: str?
  power_sensor: str?
  restart_off_seconds: int(5,300)
  dashboard_title: str
  dashboard_url: match(^[a-z0-9_]+(-[a-z0-9_]+)+$)
  dashboard_cards: list(auto|builtin|hacs)
  dashboard_hours: int(1,720)
  latency_enabled: bool
  latency_targets:
    - str
  latency_interval: int(1,60)
  latency_window: int(5,600)
  latency_threshold: int(5,1000)
  latency_method: list(auto|icmp|tcp)
  latency_tcp_port: port
