configuration:
  modem_url:
    name: Modem URL
    description: Web interface of the modem, normally http://192.168.100.1
  modem_username:
    name: Modem username
  modem_password:
    name: Modem password
    description: Default on the TC4400 is bEn2o#US9s
  scan_interval:
    name: Scan interval (seconds)
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically
  mqtt_port:
    name: MQTT port (optional)
  mqtt_username:
    name: MQTT username (optional)
  mqtt_password:
    name: MQTT password (optional)
  mqtt_topic_prefix:
    name: MQTT discovery topic prefix
  mqtt_uid_prefix:
    name: Unique ID prefix
  verbose:
    name: Verbose log
    description: Log the full scraper output on every run
  dashboard_title:
    name: Dashboard title
    description: Title of a new dashboard created by the "Create Dashboard" button
  dashboard_url:
    name: Dashboard URL
    description: Used when "Dashboard Target" is set to "New" - URL path of the new dashboard, must contain a hyphen (e.g. cable-modem)
  dashboard_cards:
    name: Dashboard cards
    description: auto = use plotly-graph / apexcharts-card if installed, builtin = only built-in cards, hacs = always use them
  dashboard_hours:
    name: Dashboard time range (hours)
  latency_enabled:
    name: Internet latency probe
    description: Continuously ping the targets below and publish latency, jitter, loss and a status
  latency_targets:
    name: Latency targets
    description: IP addresses or host names to ping (default 1.1.1.1, Cloudflare)
  latency_interval:
    name: Probe interval (seconds)
  latency_window:
    name: Statistics window (seconds)
    description: Average/P95/min/max/jitter/loss are calculated and published once per window
  latency_threshold:
    name: Congestion threshold (ms above base latency)
  latency_method:
    name: Probe method
    description: auto = ICMP ping, TCP connect if ICMP is not possible; icmp; tcp
  latency_tcp_port:
    name: TCP port for the TCP method
  history_length:
    name: Channel history (scrapes)
    description: Number of scrapes kept per channel for the trend sparklines in the channel table (0 = off)
