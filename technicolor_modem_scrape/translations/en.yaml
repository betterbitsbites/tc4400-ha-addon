configuration:
  modem_url:
    name: Modem URL
    description: Web interface of the modem, normally http://192.168.100.1
  modem_username:
    name: Modem username
  modem_password:
    name: Modem password
    description: Default on the TC4400 is bEn2o#US9s
  scan_interval:
    name: Scan interval (seconds)
  mqtt_host:
    name: MQTT host (optional)
    description: Leave empty to use the Mosquitto add-on automatically
  mqtt_port:
    name: MQTT port (optional)
  mqtt_username:
    name: MQTT username (optional)
  mqtt_password:
    name: MQTT password (optional)
  mqtt_topic_prefix:
    name: MQTT discovery topic prefix
  mqtt_uid_prefix:
    name: Unique ID prefix
  verbose:
    name: Verbose log
    description: Log the full scraper output on every run
  dashboard_title:
    name: Dashboard title
    description: Title of the dashboard created by the "Create Dashboard" button
  dashboard_url:
    name: Dashboard URL
    description: URL path, must contain a hyphen (e.g. cable-modem). An existing dashboard with this URL is overwritten.
  dashboard_cards:
    name: Dashboard cards
    description: auto = use plotly-graph / apexcharts-card if installed, builtin = only built-in cards, hacs = always use them
  dashboard_hours:
    name: Dashboard time range (hours)
